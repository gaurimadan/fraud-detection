services:
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fraud}
      POSTGRES_USER: ${POSTGRES_USER:-fraud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fraud} -d ${POSTGRES_DB:-fraud}"]
      interval: 5s
      timeout: 5s
      retries: 12

  producer:
    build:
      context: .
      dockerfile: producer/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: transactions
      PRODUCER_INTERVAL_SECONDS: 1
      DEMO_SAMPLE_DIR: /models
      DEMO_FRAUD_RATE: ${DEMO_FRAUD_RATE:-0.05}
    depends_on:
      kafka:
        condition: service_healthy
      model-trainer:
        condition: service_completed_successfully
    volumes:
      - model-artifacts:/models:ro
    restart: unless-stopped

  model-trainer:
    build:
      context: .
      dockerfile: model/Dockerfile
    command:
      - python3
      - /app/train_model.py
      - --input
      - /data/Fraud.csv
      - --output
      - /models/fraud-model.joblib
    environment:
      MODEL_MAX_ROWS_PER_CLASS: ${MODEL_MAX_ROWS_PER_CLASS:-20000}
    volumes:
      - ./data:/data:ro
      - model-artifacts:/models
    restart: "no"

  spark:
    build:
      context: .
      dockerfile: spark/Dockerfile
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[*]
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.5,org.postgresql:postgresql:42.7.5
      - /app/streaming.py
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: transactions
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-fraud}
      POSTGRES_USER: ${POSTGRES_USER:-fraud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
      CHECKPOINT_DIR: /tmp/spark-checkpoints
      MODEL_PATH: /models/fraud-model.joblib
      FRAUD_PROBABILITY_THRESHOLD: ${FRAUD_PROBABILITY_THRESHOLD:-}
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      model-trainer:
        condition: service_completed_successfully
    volumes:
      - spark-checkpoints:/tmp/spark-checkpoints
      - model-artifacts:/models:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
      POSTGRES_USER: ${POSTGRES_USER:-fraud}
      POSTGRES_DB: ${POSTGRES_DB:-fraud}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_SSLMODE: disable
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  spark-checkpoints:
  model-artifacts:
