apiVersion: 1

datasources:
  - name: Fraud PostgreSQL
    uid: fraud-postgres
    type: postgres
    access: proxy
    url: $POSTGRES_HOST:$POSTGRES_PORT
    user: $POSTGRES_USER
    secureJsonData:
      password: $POSTGRES_PASSWORD
    jsonData:
      database: $POSTGRES_DB
      sslmode: $POSTGRES_SSLMODE
      postgresVersion: 1600
      timescaledb: false
    isDefault: true
